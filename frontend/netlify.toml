# Netlify settings for the StockFlow frontend. See ../DEPLOY.md.
# In Netlify, set "Base directory" to `frontend`: this file is read from there.
# Also set the environment variable VITE_API_URL (the Fly.io API address, ending with /api/v1).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: any path serves index.html (React Router handles it).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
