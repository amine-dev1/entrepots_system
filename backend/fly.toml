# Fly.io settings for the StockFlow API. See ../DEPLOY.md.
# Change `app` if the name is taken: it becomes https://<app>.fly.dev
app = 'stockflow-api-amine'
# Pick the region closest to your Neon database.
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

# Secrets (APP_KEY, DB_URL) and the per-deployment values (APP_URL, CORS_ALLOWED_ORIGINS) are NOT here:
# they are set with `flyctl secrets set`.
[env]
  APP_ENV = 'production'
  APP_DEBUG = 'false'
  LOG_CHANNEL = 'stderr'
  DB_CONNECTION = 'pgsql'
  # An API with token auth: no sessions, cache or queue tables needed.
  SESSION_DRIVER = 'array'
  CACHE_STORE = 'array'
  QUEUE_CONNECTION = 'sync'

[http_service]
  internal_port = 8080
  force_https = true
  # Stops when idle (saves money), restarts on the next request: the first call after a pause is slower.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '20s'
    interval = '2m'
    timeout = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
